name: Prepare remembered compact points
on:
  push:
    branches: [codex/compact-wheel-remember-points]
    paths: [.github/compact-points-plan.json]
permissions:
  contents: write
jobs:
  prepare:
    if: github.event.head_commit.message == 'Stage remembered compact points'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply scoped source changes
        run: |
          python3 - <<'PY'
          import json,pathlib
          plan_path=pathlib.Path('.github/compact-points-plan.json')
          for entry in json.loads(plan_path.read_text()):
              path=pathlib.Path(entry['path'])
              text=path.read_text()
              for old,new in entry['changes']:
                  if text.count(old)!=1: raise SystemExit('Expected one source anchor in '+str(path)+': '+old[:80])
                  text=text.replace(old,new,1)
              path.write_text(text)
          plan_path.unlink()
          PY
          git diff -- index.html README.md CLAUDE.md
      - name: Check syntax and compact helpers
        run: |
          node tools/check-syntax.mjs
          node --test tools/compact-wheel-tests.mjs
      - name: Install browser runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/compact-browser" --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/compact-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check compact points and capture preview
        env:
          PW: ${{ runner.temp }}/compact-browser/node_modules/playwright/index.mjs
          BATTLE_SCREENSHOTS: ${{ runner.temp }}/compact-points-screenshots
          COMPACT_ONLY: '1'
          COMPACT_PREVIEW: '1'
        run: node tools/quick-wheel-browser-check.mjs
      - name: Save validated source
        run: |
          git add --all
          git diff --cached --quiet -- .github/workflows
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remember compact wheel points with one field and + button (v1.146.1)"
          git push origin HEAD:codex/compact-wheel-remember-points
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact-points-screenshots
          path: ${{ runner.temp }}/compact-points-screenshots
          retention-days: 3
