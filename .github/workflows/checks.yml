name: App checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Check inline scripts
        run: node tools/check-syntax.mjs
      - name: Check worksheet and recording behavior
        run: node --test tools/*-tests.mjs
      - name: Install server dependencies
        run: npm --prefix functions ci --ignore-scripts --no-audit --no-fund
      - name: Check voice server
        run: npm --prefix functions test
      - name: Load deployment entry point
        run: node -e "console.log(Object.keys(require('./functions/index.js')).join(', '))"
      - name: Install isolated browser runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/battle-browser" --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/battle-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check wheel, battle, all artwork and desktop/tablet layouts
        env:
          PW: ${{ runner.temp }}/battle-browser/node_modules/playwright/index.mjs
          BATTLE_SCREENSHOTS: ${{ runner.temp }}/battle-screenshots
          SNAP_SCREENSHOTS: ${{ runner.temp }}/battle-screenshots/shape-snap
          QB_SCREENSHOTS: ${{ runner.temp }}/battle-screenshots/question-bank
          LA_SCREENSHOTS: ${{ runner.temp }}/battle-screenshots/living-apps
          LL_SCREENSHOTS: ${{ runner.temp }}/battle-screenshots/living-library
          VP_SCREENSHOTS: ${{ runner.temp }}/battle-screenshots/video-playlist
          MS_SCREENSHOTS: ${{ runner.temp }}/battle-screenshots/model-studio
          SNIP_SCREENSHOTS: ${{ runner.temp }}/battle-screenshots/snip-pin
          QR_SCREENSHOTS: ${{ runner.temp }}/battle-screenshots/qr-reader
          GUIDE_SCREENSHOTS: ${{ runner.temp }}/battle-screenshots/student-guide
          LS_SCREENSHOTS: ${{ runner.temp }}/battle-screenshots/lesson-splash
          RD_SCREENSHOTS: ${{ runner.temp }}/battle-screenshots/rune-door
          DS_SCREENSHOTS: ${{ runner.temp }}/battle-screenshots/day-slots
          CS_SCREENSHOTS: ${{ runner.temp }}/battle-screenshots/command-search
          RN_SCREENSHOTS: ${{ runner.temp }}/battle-screenshots/record-nudge
          CQ_SCREENSHOTS: ${{ runner.temp }}/battle-screenshots/class-queue
        run: |
          node tools/wheel-check.mjs
          node tools/account-email-check.mjs
          node tools/classroom-battle-browser-check.mjs
          node tools/hero-items-browser-check.mjs
          node tools/hero-skill-tree-browser-check.mjs
          node tools/adventure-browser-check.mjs
          node tools/student-heroes-browser-check.mjs
          node tools/hero-market-browser-check.mjs
          node tools/quick-wheel-browser-check.mjs
          node tools/quest-stage-browser-check.mjs
          node tools/treasure-chests-browser-check.mjs
          node tools/battle-pets-browser-check.mjs
          node tools/lesson-guests-browser-check.mjs
          node tools/team-battle-browser-check.mjs
          node tools/quest-browser-check.mjs
          node tools/battle-animation-browser-check.mjs
          node tools/mission-machine-browser-check.mjs
          node tools/mission-slot-browser-check.mjs
          node tools/mission-animation-browser-check.mjs
          node tools/shape-snap-browser-check.mjs
          node tools/live-cams-check.mjs
          node tools/question-bank-check.mjs
          node tools/living-apps-check.mjs
          node tools/living-library-check.mjs
          node tools/video-playlist-check.mjs
          node tools/lesson-splash-check.mjs
          node tools/rune-door-check.mjs
          node tools/model-studio-check.mjs
          node tools/snip-pin-check.mjs
          node tools/qr-reader-check.mjs
          node tools/student-guide-check.mjs
          node tools/day-slots-check.mjs
          node tools/class-queue-check.mjs
          node tools/command-search-check.mjs
          node tools/record-nudge-check.mjs
          node tools/screen-record-check.mjs
          node tools/caption-check.mjs
          node tools/lesson-upload-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: classroom-battle-screenshots
          path: ${{ runner.temp }}/battle-screenshots
          if-no-files-found: ignore
          retention-days: 7
