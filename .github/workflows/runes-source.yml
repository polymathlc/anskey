name: Prepare rune feature source
on:
  push:
    branches: [codex/runes-sockets-unique-items]
    paths: ['.github/rune-parts/**', '.github/runes-source.patch.gz.b64', '.github/workflows/runes-source.yml']
permissions:
  contents: write
concurrency:
  group: prepare-rune-source
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/runes-sockets-unique-items
      - name: Restore verified artwork and source
        run: |
          python3 - <<'PY'
          import pathlib,hashlib,base64,gzip,subprocess
          root=pathlib.Path('.github/rune-parts')
          targets=[('runes-1.png','cef9e8fd77db195037131435c76233c58d52a3d51a7c55a859b962e5b353a574'),('uniques-1.png','78a4bbe94de4169e162e9b12e9c1cc082b6215798fd3df31f6df46788cf30518')]
          if root.exists():
            for i,(name,expected) in enumerate(targets):
              data=b''.join(p.read_bytes() for p in sorted(root.glob('part-'+str(i)+'-*')))
              assert hashlib.sha256(data).hexdigest()==expected,'Artwork checksum mismatch: '+name
              target=pathlib.Path('assets/battle-pixel/items')/name
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes(data)
            subprocess.run(['git','rm','-rf','.github/rune-parts'],check=True)
          patch=pathlib.Path('.github/runes-source.patch.gz.b64')
          if patch.exists():
            data=gzip.decompress(base64.b64decode(patch.read_bytes()))
            subprocess.run(['git','apply','--index','-'],input=data,check=True)
            subprocess.run(['git','rm',str(patch)],check=True)
          PY
          git add --all
          git diff --cached --quiet -- .github/workflows
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Restore verified rune feature assets and source'
            git push origin HEAD:codex/runes-sockets-unique-items
          fi
