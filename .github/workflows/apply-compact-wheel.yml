name: Apply compact wheel source
on:
  push:
    branches: [codex/compact-wheel-name-slots]
    paths: [.github/compact-wheel.patch.gz.b64]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message == 'Stage tested compact wheel patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply tested source
        shell: bash
        run: |
          base64 --decode .github/compact-wheel.patch.gz.b64 | gzip --decompress > "$RUNNER_TEMP/compact-wheel.patch"
          git apply --check "$RUNNER_TEMP/compact-wheel.patch"
          git apply "$RUNNER_TEMP/compact-wheel.patch"
          rm .github/compact-wheel.patch.gz.b64
          git add --all
          git diff --cached --quiet -- .github/workflows
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add movable compact wheel with rolling name slots (v1.146.0)"
          git push origin HEAD:codex/compact-wheel-name-slots
