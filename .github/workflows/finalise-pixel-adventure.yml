name: Finalise pixel adventure upload
on:
  push:
    branches: [codex/pixel-adventure-build-synergies]
permissions:
  contents: write
jobs:
  finalise:
    if: github.repository == 'polymathlc/anskey' && github.event.head_commit.message == 'Publish verified source patch for v1.144.0'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/pixel-adventure-build-synergies
          fetch-depth: 0
      - name: Apply the tested source patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/pixel-adventure.patch.gz.b64 | gzip --decompress > "$RUNNER_TEMP/pixel-adventure.patch"
          git apply --check "$RUNNER_TEMP/pixel-adventure.patch"
          git apply "$RUNNER_TEMP/pixel-adventure.patch"
          rm .github/pixel-adventure.patch.gz.b64
          git add -A
          git diff --cached --quiet -- .github/workflows
          git config user.name Codex
          git config user.email codex@openai.com
          git commit -m "Add pixel adventures, branching skills and party build synergies (v1.144.0)"
          git push origin HEAD:refs/heads/codex/pixel-adventure-build-synergies
